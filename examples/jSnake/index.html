<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jSnake</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <div id="snakeDiv"></div>
    <div id="scoreboard">SCORE: 0</div>
    <div id="joystick" style="width: 128px; position: relative">
      <img src="images/joystick-base.png"/>
      <div id="stick1" style="position: absolute; left:32px; top:32px;">
      <img src="images/joystick-red.png"/>	
      </div>
      <input type="text" id="joystickXvalue" hidden>
      <input type="text" id="joystickYvalue" hidden>
    </div>
    <input type="text" id="currentDirection">
    <input type="button" id="submitLeft" value="left">
    <input type="button" id="submitRight" value="right">	
    <input type="button" id="submitUp" value="up">	
    <input type="button" id="submitDown" value="down">		
  </div>
  <script src="js/joystick.js" type="text/javascript"></script>
  <script src="js/jsnake.js" type="text/javascript"></script>
</body>

</html>
